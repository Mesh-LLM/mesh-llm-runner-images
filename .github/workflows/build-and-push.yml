name: Build and Push Runner Images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      mesh_ref:
        description: MeshLLM git ref whose manifests should be injected
        required: true
        default: main
      operation:
        description: Validate only, stage verified candidates, or promote production aliases
        type: choice
        required: true
        default: validate
        options:
          - validate
          - stage
          - promote
      staged_run_id:
        description: Successful staged run ID required for manual promotion
        type: string
      staged_run_attempt:
        description: Exact successful staged attempt required for manual promotion
        type: string
      canary_id:
        description: Stable lowercase cache identity for repeated trusted canaries
        type: string
        required: true
        default: default

concurrency:
  group: runner-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mesh-llm/mesh-llm-cuda-runner
  MESH_REF: ${{ inputs.mesh_ref || 'main' }}

jobs:
  policy:
    name: Workflow and candidate policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPOT_PROJECT_ID: mzm95zcv7p
    outputs:
      execution_mode: ${{ steps.mode.outputs.execution_mode }}
      orchestration_runner: ${{ steps.runners.outputs.orchestration_runner }}
      runner_provider: ${{ steps.runners.outputs.runner_provider }}
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select trusted runner provider
        id: runners
        shell: bash
        env:
          DEPOT_RUNNERS_SETTING: ${{ vars.DEPOT_RUNNERS_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          selection="$(
            scripts/select-runner-provider.sh \
              "$EVENT_NAME" \
              "$WORKFLOW_REF" \
              "$DEPOT_RUNNERS_SETTING"
          )"
          echo "runner_provider=$(jq -er '.provider' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          echo "orchestration_runner=$(jq -er '.orchestration_runner' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          {
            echo "## Runner provider"
            echo
            echo '```json'
            jq . <<< "$selection"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select execution mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_MODE: ${{ inputs.operation || 'validate' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          CANARY_ID: ${{ inputs.canary_id || 'default' }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          STAGED_RUN_ATTEMPT: ${{ inputs.staged_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANARY_ID" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]] || {
            echo "invalid canary cache identity: $CANARY_ID" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_MODE" == promote ]]; then
            [[ "$STAGED_RUN_ID" =~ ^[1-9][0-9]*$ && "$STAGED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "manual promotion requires staged_run_id and staged_run_attempt" >&2
              exit 1
            }
          else
            [[ -z "$STAGED_RUN_ID" && -z "$STAGED_RUN_ATTEMPT" ]] || {
              echo "staged run inputs apply only to manual promotion" >&2
              exit 1
            }
          fi
          selection="$(
            scripts/select-workflow-mode.sh \
              "$EVENT_NAME" \
              "$REPOSITORY" \
              "$WORKFLOW_SOURCE_REF" \
              "$WORKFLOW_REF" \
              "$REQUESTED_MODE"
          )"
          echo "execution_mode=$(jq -er '.execution_mode' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          {
            echo "## Execution mode"
            echo
            echo '```json'
            jq . <<< "$selection"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Depot remote builder configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPOT_PROJECT_ID" == mzm95zcv7p ]] || {
            echo "unexpected checked-in Depot project ID: $DEPOT_PROJECT_ID" >&2
            exit 1
          }

      - name: Install verified actionlint
        run: |
          scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Validate workflow definitions
        run: actionlint -config-file .github/actionlint.yaml

      - name: Test runner image contracts
        run: bash scripts/test.sh

      - name: Lint shell sources
        run: |
          find scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck

  prepare:
    needs: policy
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'promote'
    runs-on: ${{ needs.policy.outputs.orchestration_runner }}
    timeout-minutes: 15
    outputs:
      family_matrix: ${{ steps.metadata.outputs.family_matrix }}
      promotion_matrix: ${{ steps.metadata.outputs.promotion_matrix }}
      canary_id: ${{ steps.metadata.outputs.canary_id }}
      execution_mode: ${{ steps.metadata.outputs.execution_mode }}
      mesh_revision: ${{ steps.metadata.outputs.mesh_revision }}
      orchestration_runner: ${{ steps.metadata.outputs.orchestration_runner }}
      runner_images_revision: ${{ steps.metadata.outputs.runner_images_revision }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pull requests need their base and head history for family planning;
          # trusted non-PR runs only resolve the checked-out revision.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Checkout MeshLLM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Mesh-LLM/mesh-llm
          ref: ${{ env.MESH_REF }}
          path: _target/mesh-llm
          persist-credentials: false

      - name: Capture immutable metadata and matrices
        id: metadata
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANARY_ID: ${{ inputs.canary_id || 'default' }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTION_MODE: ${{ needs.policy.outputs.execution_mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORCHESTRATION_RUNNER: ${{ needs.policy.outputs.orchestration_runner }}
        run: |
          set -euo pipefail
          mesh_revision="$(git -C _target/mesh-llm rev-parse HEAD)"
          runner_images_revision="$(git rev-parse HEAD)"

          matrices="$(scripts/generate-workflow-matrices.sh)"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed_files="$RUNNER_TEMP/runner-image-changed-files.txt"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
            plan="$(
              scripts/plan-pr-families.sh \
                config/runner-image-families.json \
                "$changed_files"
            )"
            family_matrix="$(jq -c '.family_matrix' <<< "$plan")"
            {
              echo "## Pull-request image-family plan"
              echo
              jq -r '"- Changed files: \(.selection.changed_files)\n- Selected families: \(.selection.selected_families)\n- Exhaustive: \(.selection.exhaustive)"' \
                <<< "$plan"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            family_matrix="$(jq -c '.family_matrix' <<< "$matrices")"
          fi
          promotion_matrix="$(jq -c '.promotion_matrix' <<< "$matrices")"
          {
            echo "canary_id=$CANARY_ID"
            echo "execution_mode=$EXECUTION_MODE"
            echo "mesh_revision=$mesh_revision"
            echo "orchestration_runner=$ORCHESTRATION_RUNNER"
            echo "runner_images_revision=$runner_images_revision"
            echo "timestamp=$(date -u +%Y%m%d%H%M%S)"
            echo "family_matrix=$(jq -c . <<< "$family_matrix")"
            echo "promotion_matrix=$promotion_matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Generate environment manifest bundles
        run: scripts/prepare-build-context.sh _target/mesh-llm

      - name: Summarize manifest audit
        run: |
          for profile in public self-hosted; do
            count="$(jq '.manifests | length' "build-context/manifests/$profile/manifest-index.json")"
            echo "$profile: $count manifests"
          done

      - name: Upload manifest bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-manifest-bundles-${{ github.run_attempt }}
          path: build-context/manifests
          if-no-files-found: error
          retention-days: 14

  validate_families:
    name: Validate ${{ matrix.environment }} ${{ matrix.backend_id }}
    needs: prepare
    if: needs.prepare.outputs.execution_mode == 'validate'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.family_matrix) }}
    uses: ./.github/workflows/stage-image-family.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ matrix.environment }}
      backend_id: ${{ matrix.backend_id }}
      backend_name: ${{ matrix.backend_name }}
      dockerfile: ${{ matrix.dockerfile }}
      cuda_series: ${{ matrix.cuda_series }}
      rocm_version: ${{ matrix.rocm_version }}
      architectures: ${{ matrix.architectures }}
      mesh_revision: ${{ needs.prepare.outputs.mesh_revision }}
      runner_images_revision: ${{ needs.prepare.outputs.runner_images_revision }}
      execution_mode: validate
      canary_id: ${{ needs.prepare.outputs.canary_id }}

  stage_families:
    name: Stage ${{ matrix.environment }} ${{ matrix.backend_id }}
    needs: prepare
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && (
        needs.prepare.outputs.execution_mode == 'stage'
        || needs.prepare.outputs.execution_mode == 'promote'
      )
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.family_matrix) }}
    uses: ./.github/workflows/stage-image-family.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    with:
      environment: ${{ matrix.environment }}
      backend_id: ${{ matrix.backend_id }}
      backend_name: ${{ matrix.backend_name }}
      dockerfile: ${{ matrix.dockerfile }}
      cuda_series: ${{ matrix.cuda_series }}
      rocm_version: ${{ matrix.rocm_version }}
      architectures: ${{ matrix.architectures }}
      mesh_revision: ${{ needs.prepare.outputs.mesh_revision }}
      runner_images_revision: ${{ needs.prepare.outputs.runner_images_revision }}
      execution_mode: ${{ needs.prepare.outputs.execution_mode }}
      canary_id: ${{ needs.prepare.outputs.canary_id }}

  assemble_self_hosted_compatibility:
    name: Assemble self-hosted compatibility index
    needs: [prepare, stage_families]
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && (
        needs.prepare.outputs.execution_mode == 'stage'
        || needs.prepare.outputs.execution_mode == 'promote'
      )
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified platform candidates for catalog sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-platform-*-${{ github.run_attempt }}
          path: /tmp/compatibility-platforms
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR for compatibility staging
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Assemble and validate compatibility index
        id: candidate
        shell: bash
        env:
          MESH_REVISION: ${{ needs.prepare.outputs.mesh_revision }}
          RUNNER_IMAGES_REVISION: ${{ needs.prepare.outputs.runner_images_revision }}
        run: |
          set -euo pipefail
          descriptor=/tmp/candidate-index-self-hosted-compatibility.json
          python3 scripts/assemble-runner-index.py \
            --platforms /tmp/compatibility-platforms \
            --environment self-hosted --backend-id compatibility \
            --mesh-revision "$MESH_REVISION" --runner-images-revision "$RUNNER_IMAGES_REVISION" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$descriptor"
          echo "descriptor=$descriptor" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -er '.digest' "$descriptor")" >> "$GITHUB_OUTPUT"

      - name: Attest verified compatibility digest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true

      - name: Upload verified compatibility candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-index-self-hosted-compatibility-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.descriptor }}
          if-no-files-found: error
          retention-days: 14

  seal_cohort:
    name: Retain complete verified cohort
    needs: [prepare, stage_families, assemble_self_hosted_compatibility]
    if: needs.prepare.outputs.execution_mode != 'validate'
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout trusted cohort helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download staged candidates without merging filenames
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-*-${{ github.run_attempt }}
          path: /tmp/staged-evidence
      - name: Download staged identity evidence without merging filenames
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runner-identity-*-${{ github.run_attempt }}
          path: /tmp/staged-evidence
      - name: Seal complete verified cohort
        env:
          GH_TOKEN: ${{ github.token }}
          MESH_REVISION: ${{ needs.prepare.outputs.mesh_revision }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
        run: |
          python3 scripts/runner-cohort.py seal \
            --artifacts /tmp/staged-evidence \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --mesh-revision "$MESH_REVISION" --timestamp "$TIMESTAMP" \
            --output /tmp/staged-cohort.json
      - name: Retain staged cohort for exact-attempt promotion
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staged-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/staged-cohort.json
          if-no-files-found: error
          retention-days: 14

  admit_cohort:
    name: Admit retained staged attempt
    needs: policy
    if: github.event_name == 'workflow_dispatch' && needs.policy.outputs.execution_mode == 'promote'
    runs-on: ${{ needs.policy.outputs.orchestration_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout current trusted admission helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Admit exact successful run attempt and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          STAGED_RUN_ATTEMPT: ${{ inputs.staged_run_attempt }}
        run: |
          python3 scripts/runner-cohort.py fetch \
            --run-id "$STAGED_RUN_ID" --attempt "$STAGED_RUN_ATTEMPT" \
            --output /tmp/staged-cohort.json
      - name: Retain admitted data in this promotion attempt
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admitted-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/staged-cohort.json
          if-no-files-found: error
          retention-days: 14

  publish_cohort:
    name: Publish one complete verified cohort
    needs: [policy, seal_cohort, admit_cohort]
    if: >-
      always() && !cancelled()
      && github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && needs.policy.outputs.execution_mode == 'promote'
      && (needs.seal_cohort.result == 'success' || needs.admit_cohort.result == 'success')
    # The caller holds this lock across every job in the reusable publication.
    # Staging never acquires it. Up to 100 pending cohorts can wait without
    # replacing one another; GitHub cancels arrivals beyond that capacity.
    concurrency:
      group: runner-image-publication
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/publish-cohort.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      artifact_id: ${{ needs.admit_cohort.outputs.artifact_id || needs.seal_cohort.outputs.artifact_id }}
      orchestration_runner: ${{ needs.policy.outputs.orchestration_runner }}
