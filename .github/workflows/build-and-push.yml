name: Build and Push Runner Images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      mesh_ref:
        description: MeshLLM git ref whose manifests should be injected
        required: true
        default: main
      operation:
        description: Validate only, stage verified candidates, or promote production aliases
        type: choice
        required: true
        default: validate
        options:
          - validate
          - stage
          - promote
      canary_id:
        description: Stable lowercase cache identity for repeated trusted canaries
        type: string
        required: true
        default: default

concurrency:
  group: runner-image-${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'validate')) && 'registry-mutation' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mesh-llm/mesh-llm-cuda-runner
  MESH_REF: ${{ inputs.mesh_ref || 'main' }}

jobs:
  policy:
    name: Workflow and candidate policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      execution_mode: ${{ steps.mode.outputs.execution_mode }}
      orchestration_runner: ${{ steps.runners.outputs.orchestration_runner }}
      runner_provider: ${{ steps.runners.outputs.runner_provider }}
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select trusted runner provider
        id: runners
        shell: bash
        env:
          DEPOT_RUNNERS_SETTING: ${{ vars.DEPOT_RUNNERS_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          selection="$(
            scripts/select-runner-provider.sh \
              "$EVENT_NAME" \
              "$WORKFLOW_REF" \
              "$DEPOT_RUNNERS_SETTING"
          )"
          echo "runner_provider=$(jq -er '.provider' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          echo "orchestration_runner=$(jq -er '.orchestration_runner' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          {
            echo "## Runner provider"
            echo
            echo '```json'
            jq . <<< "$selection"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select execution mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_MODE: ${{ inputs.operation || 'validate' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
          CANARY_ID: ${{ inputs.canary_id || 'default' }}
        run: |
          set -euo pipefail
          [[ "$CANARY_ID" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]] || {
            echo "invalid canary cache identity: $CANARY_ID" >&2
            exit 1
          }
          selection="$(
            scripts/select-workflow-mode.sh \
              "$EVENT_NAME" \
              "$REPOSITORY" \
              "$WORKFLOW_SOURCE_REF" \
              "$WORKFLOW_REF" \
              "$REQUESTED_MODE"
          )"
          echo "execution_mode=$(jq -er '.execution_mode' <<< "$selection")" \
            >> "$GITHUB_OUTPUT"
          {
            echo "## Execution mode"
            echo
            echo '```json'
            jq . <<< "$selection"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install verified actionlint
        run: |
          scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Validate workflow definitions
        run: actionlint -config-file .github/actionlint.yaml

      - name: Test immutable candidate contract
        run: |
          tests/candidate-promotion.test.sh
          tests/cohort-promotion.test.sh
          tests/promotion-tags.test.sh
          tests/workflow-matrix.test.sh

      - name: Lint shell sources
        run: |
          find scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck

  prepare:
    needs: policy
    runs-on: ${{ needs.policy.outputs.orchestration_runner }}
    timeout-minutes: 15
    outputs:
      family_matrix: ${{ steps.metadata.outputs.family_matrix }}
      promotion_matrix: ${{ steps.metadata.outputs.promotion_matrix }}
      canary_id: ${{ steps.metadata.outputs.canary_id }}
      execution_mode: ${{ steps.metadata.outputs.execution_mode }}
      mesh_revision: ${{ steps.metadata.outputs.mesh_revision }}
      orchestration_runner: ${{ steps.metadata.outputs.orchestration_runner }}
      runner_images_revision: ${{ steps.metadata.outputs.runner_images_revision }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout MeshLLM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Mesh-LLM/mesh-llm
          ref: ${{ env.MESH_REF }}
          path: _target/mesh-llm
          persist-credentials: false

      - name: Capture immutable metadata and matrices
        id: metadata
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANARY_ID: ${{ inputs.canary_id || 'default' }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTION_MODE: ${{ needs.policy.outputs.execution_mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORCHESTRATION_RUNNER: ${{ needs.policy.outputs.orchestration_runner }}
        run: |
          set -euo pipefail
          mesh_revision="$(git -C _target/mesh-llm rev-parse HEAD)"
          runner_images_revision="$(git rev-parse HEAD)"

          matrices="$(scripts/generate-workflow-matrices.sh)"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed_files="$RUNNER_TEMP/runner-image-changed-files.txt"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
            plan="$(
              scripts/plan-pr-families.sh \
                config/runner-image-families.json \
                "$changed_files"
            )"
            family_matrix="$(jq -c '.family_matrix' <<< "$plan")"
            {
              echo "## Pull-request image-family plan"
              echo
              jq -r '"- Changed files: \(.selection.changed_files)\n- Selected families: \(.selection.selected_families)\n- Exhaustive: \(.selection.exhaustive)"' \
                <<< "$plan"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            family_matrix="$(jq -c '.family_matrix' <<< "$matrices")"
          fi
          promotion_matrix="$(jq -c '.promotion_matrix' <<< "$matrices")"
          {
            echo "canary_id=$CANARY_ID"
            echo "execution_mode=$EXECUTION_MODE"
            echo "mesh_revision=$mesh_revision"
            echo "orchestration_runner=$ORCHESTRATION_RUNNER"
            echo "runner_images_revision=$runner_images_revision"
            echo "timestamp=$(date -u +%Y%m%d%H%M%S)"
            echo "family_matrix=$(jq -c . <<< "$family_matrix")"
            echo "promotion_matrix=$promotion_matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Generate environment manifest bundles
        run: scripts/prepare-build-context.sh _target/mesh-llm

      - name: Summarize manifest audit
        run: |
          for profile in public self-hosted; do
            count="$(jq '.manifests | length' "build-context/manifests/$profile/manifest-index.json")"
            echo "$profile: $count manifests"
          done

      - name: Upload manifest bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-manifest-bundles
          path: build-context/manifests
          if-no-files-found: error
          retention-days: 1

  validate_families:
    name: Validate ${{ matrix.environment }} ${{ matrix.backend_id }}
    needs: prepare
    if: needs.prepare.outputs.execution_mode == 'validate'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.family_matrix) }}
    uses: ./.github/workflows/stage-image-family.yml
    permissions:
      contents: read
    with:
      environment: ${{ matrix.environment }}
      backend_id: ${{ matrix.backend_id }}
      backend_name: ${{ matrix.backend_name }}
      cuda_series: ${{ matrix.cuda_series }}
      rocm_version: ${{ matrix.rocm_version }}
      architectures: ${{ matrix.architectures }}
      mesh_revision: ${{ needs.prepare.outputs.mesh_revision }}
      runner_images_revision: ${{ needs.prepare.outputs.runner_images_revision }}
      execution_mode: validate
      canary_id: ${{ needs.prepare.outputs.canary_id }}

  stage_families:
    name: Stage ${{ matrix.environment }} ${{ matrix.backend_id }}
    needs: prepare
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && (
        needs.prepare.outputs.execution_mode == 'stage'
        || needs.prepare.outputs.execution_mode == 'promote'
      )
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.family_matrix) }}
    uses: ./.github/workflows/stage-image-family.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: ${{ matrix.environment }}
      backend_id: ${{ matrix.backend_id }}
      backend_name: ${{ matrix.backend_name }}
      cuda_series: ${{ matrix.cuda_series }}
      rocm_version: ${{ matrix.rocm_version }}
      architectures: ${{ matrix.architectures }}
      mesh_revision: ${{ needs.prepare.outputs.mesh_revision }}
      runner_images_revision: ${{ needs.prepare.outputs.runner_images_revision }}
      execution_mode: ${{ needs.prepare.outputs.execution_mode }}
      canary_id: ${{ needs.prepare.outputs.canary_id }}

  assemble_self_hosted_compatibility:
    name: Assemble self-hosted compatibility index
    needs: [prepare, stage_families]
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && (
        needs.prepare.outputs.execution_mode == 'stage'
        || needs.prepare.outputs.execution_mode == 'promote'
      )
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download CUDA 12 AMD64 platform candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-platform-self-hosted-cuda12-amd64
          path: /tmp/compatibility/cuda12

      - name: Download CPU ARM64 platform candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-platform-self-hosted-cpu-arm64
          path: /tmp/compatibility/cpu

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR for compatibility staging
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Assemble and validate compatibility index
        id: candidate
        shell: bash
        env:
          MESH_REVISION: ${{ needs.prepare.outputs.mesh_revision }}
          RUNNER_IMAGES_REVISION: ${{ needs.prepare.outputs.runner_images_revision }}
        run: |
          set -euo pipefail
          cuda_descriptor="$(find /tmp/compatibility/cuda12 -type f -name '*.json' -print -quit)"
          cpu_descriptor="$(find /tmp/compatibility/cpu -type f -name '*.json' -print -quit)"
          [[ -n "$cuda_descriptor" && -n "$cpu_descriptor" ]]

          validate_platform() {
            local descriptor_file="$1"
            local backend_id="$2"
            local backend_name="$3"
            local cuda_series="$4"
            local architecture="$5"
            jq -e \
              --arg image "$IMAGE" \
              --arg backend_id "$backend_id" \
              --arg backend_name "$backend_name" \
              --arg cuda_series "$cuda_series" \
              --arg architecture "$architecture" \
              --arg mesh_revision "$MESH_REVISION" \
              --arg runner_images_revision "$RUNNER_IMAGES_REVISION" \
              '
                def exact_keys($expected): (keys | sort) == ($expected | sort);
                def digest: type == "string" and test("^sha256:[0-9a-f]{64}$");
                type == "object"
                and exact_keys([
                  "backend",
                  "child_digest",
                  "digest",
                  "environment",
                  "image",
                  "mesh_revision",
                  "platform",
                  "runner_images_revision",
                  "schema",
                  "type"
                ])
                and .schema == 1
                and .type == "mesh-llm-runner-image-platform-candidate"
                and .image == $image
                and .environment == "self-hosted"
                and .backend == {
                  id: $backend_id,
                  name: $backend_name,
                  cuda_series: (
                    if $cuda_series == "none"
                    then null
                    else $cuda_series
                    end
                  ),
                  rocm_version: null
                }
                and .mesh_revision == $mesh_revision
                and .runner_images_revision == $runner_images_revision
                and .platform == {
                  os: "linux",
                  architecture: $architecture
                }
                and (.digest | digest)
                and (.child_digest | digest)
              ' "$descriptor_file" >/dev/null
          }
          validate_platform "$cuda_descriptor" cuda12 cuda 12-9 amd64
          validate_platform "$cpu_descriptor" cpu cpu none arm64

          sources=(
            "${IMAGE}@$(jq -er '.digest' "$cuda_descriptor")"
            "${IMAGE}@$(jq -er '.digest' "$cpu_descriptor")"
          )
          expected_children="$(
            jq -sc \
              '[.[] | {
                architecture: .platform.architecture,
                digest: .child_digest,
                os: .platform.os
              }] | sort_by(.architecture)' \
              "$cuda_descriptor" "$cpu_descriptor"
          )"
          candidate_tag="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-self-hosted-compatibility"
          docker buildx imagetools create --tag "$candidate_tag" "${sources[@]}"
          manifest_json="$(docker buildx imagetools inspect "$candidate_tag" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest_json")"
          raw_manifest="$(docker buildx imagetools inspect "${IMAGE}@${digest}" --raw)"
          actual_children="$(
            jq -ce \
              '
                if (
                  .schemaVersion == 2
                  and (.manifests | type == "array")
                  and all(
                    .manifests[];
                    .platform.os == "linux"
                    or (
                      .platform.os == "unknown"
                      and .platform.architecture == "unknown"
                      and .annotations["vnd.docker.reference.type"] == "attestation-manifest"
                    )
                  )
                ) then
                  [
                    .manifests[]
                    | select(.platform.os == "linux")
                    | {
                        architecture: .platform.architecture,
                        digest: .digest,
                        os: .platform.os
                      }
                  ] | sort_by(.architecture)
                else
                  error("invalid compatibility index")
                end
              ' <<< "$raw_manifest"
          )"
          [[ "$actual_children" == "$expected_children" ]]

          descriptor=/tmp/candidate-index-self-hosted-compatibility.json
          jq -n \
            --arg image "$IMAGE" \
            --arg runner_images_revision "$RUNNER_IMAGES_REVISION" \
            --arg mesh_revision "$MESH_REVISION" \
            --arg digest "$digest" \
            --argjson children "$actual_children" \
            '{
              schema: 1,
              type: "mesh-llm-runner-image-candidate",
              image: $image,
              environment: "self-hosted",
              backend: {
                id: "compatibility",
                name: "mixed",
                cuda_series: null,
                rocm_version: null
              },
              runner_images_revision: $runner_images_revision,
              mesh_revision: $mesh_revision,
              digest: $digest,
              children: $children
            }' > "$descriptor"
          scripts/validate-candidate-descriptor.sh \
            --descriptor "$descriptor" \
            --image "$IMAGE" \
            --environment self-hosted \
            --backend-id compatibility \
            --backend-name mixed \
            --cuda-series none \
            --rocm-version none \
            --mesh-revision "$MESH_REVISION" \
            --runner-images-revision "$RUNNER_IMAGES_REVISION" \
            --architectures amd64,arm64
          echo "descriptor=$descriptor" >> "$GITHUB_OUTPUT"

      - name: Upload verified compatibility candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-index-self-hosted-compatibility
          path: ${{ steps.candidate.outputs.descriptor }}
          if-no-files-found: error
          retention-days: 1

  promote_versioned:
    name: Promote versioned ${{ matrix.tag_stem }}
    needs: [prepare, stage_families, assemble_self_hosted_compatibility]
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && needs.prepare.outputs.execution_mode == 'promote'
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.promotion_matrix) }}
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified candidate descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/candidate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR for versioned promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote verified versioned tags
        id: promote
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          BACKEND_ID: ${{ matrix.backend_id }}
          BACKEND_NAME: ${{ matrix.backend_name }}
          CUDA_SERIES: ${{ matrix.cuda_series }}
          ROCM_VERSION: ${{ matrix.rocm_version }}
          ARCHITECTURES: ${{ matrix.architectures }}
          TAG_STEM: ${{ matrix.tag_stem }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          MESH_REVISION: ${{ needs.prepare.outputs.mesh_revision }}
          RUNNER_IMAGES_REVISION: ${{ needs.prepare.outputs.runner_images_revision }}
          COMPATIBILITY_TAG_STEM: ${{ matrix.compatibility_tag_stem }}
        run: |
          set -euo pipefail
          descriptor="$(find /tmp/candidate -maxdepth 1 -type f -name '*.json' -print -quit)"
          [[ -n "$descriptor" ]]
          content_digest="$(jq -er '.digest' "$descriptor")"
          mapfile -t promotion_tags < <(
            scripts/generate-promotion-tags.sh \
              versioned \
              "$IMAGE" \
              "$TAG_STEM" \
              "$COMPATIBILITY_TAG_STEM" \
              "$TIMESTAMP" \
              "$MESH_REVISION" \
              "$RUNNER_IMAGES_REVISION" \
              "$content_digest"
          )
          scripts/promote-image-digest.sh \
            --descriptor "$descriptor" \
            --image "$IMAGE" \
            --environment "$ENVIRONMENT" \
            --backend-id "$BACKEND_ID" \
            --backend-name "$BACKEND_NAME" \
            --cuda-series "$CUDA_SERIES" \
            --rocm-version "$ROCM_VERSION" \
            --mesh-revision "$MESH_REVISION" \
            --runner-images-revision "$RUNNER_IMAGES_REVISION" \
            --architectures "$ARCHITECTURES" \
            "${promotion_tags[@]}"
          echo "digest=$(jq -er '.digest' "$descriptor")" >> "$GITHUB_OUTPUT"

      - name: Attest promoted candidate digest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

  prepare_latest_cohort:
    name: Prepare latest cohort manifest
    needs: [prepare, promote_versioned]
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && needs.prepare.outputs.execution_mode == 'promote'
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download complete verified candidate cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-index-*
          path: /tmp/candidate-cohort
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR for latest preflight
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Capture target and previous latest digests
        env:
          PROMOTION_MATRIX: ${{ needs.prepare.outputs.promotion_matrix }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          MESH_REVISION: ${{ needs.prepare.outputs.mesh_revision }}
          RUNNER_IMAGES_REVISION: ${{ needs.prepare.outputs.runner_images_revision }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PROMOTION_MATRIX" > /tmp/promotion-matrix.json
          scripts/generate-latest-cohort.sh \
            --descriptors /tmp/candidate-cohort \
            --matrix /tmp/promotion-matrix.json \
            --image "$IMAGE" \
            --timestamp "$TIMESTAMP" \
            --mesh-revision "$MESH_REVISION" \
            --runner-images-revision "$RUNNER_IMAGES_REVISION" \
            --output /tmp/latest-cohort.json
          jq . /tmp/latest-cohort.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest cohort reconciliation manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latest-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/latest-cohort.json
          if-no-files-found: error
          retention-days: 14

  promote_latest:
    name: Reconcile latest cohort
    needs: [prepare, prepare_latest_cohort]
    if: >-
      github.repository == 'Mesh-LLM/mesh-llm-runner-images'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == 'Mesh-LLM/mesh-llm-runner-images/.github/workflows/build-and-push.yml@refs/heads/main'
      && needs.prepare.outputs.execution_mode == 'promote'
    runs-on: ${{ needs.prepare.outputs.orchestration_runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout runner image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download latest cohort reconciliation manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: latest-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/latest-cohort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR for latest reconciliation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Converge the eventual latest cohort
        run: |
          set -euo pipefail
          manifest="$(find /tmp/latest-cohort -type f -name '*.json' -print -quit)"
          [[ -n "$manifest" ]]
          scripts/reconcile-image-cohort.sh "$manifest" target
